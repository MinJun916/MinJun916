name: GitHub language metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/render-language-metrics.py
      - scripts/test_render_language_metrics.py

permissions:
  contents: write

concurrency:
  group: github-language-metrics
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify language card renderer
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Prepare Metrics image with private clone authentication
        run: |
          mkdir -p "$RUNNER_TEMP/metrics-image"
          cd "$RUNNER_TEMP/metrics-image"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/lowlighter/metrics/366f8b9dfe3a59656c67d5dcad9950f59c9bc96d/source/plugins/languages/analyzer/analyzer.mjs \
            --output analyzer.mjs
          docker build --tag metrics:3.34.0 . --file - <<'DOCKERFILE'
          FROM ghcr.io/lowlighter/metrics:v3.34
          COPY analyzer.mjs /metrics/source/plugins/languages/analyzer/analyzer.mjs
          DOCKERFILE
      - name: Generate indepth language statistics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: "no"
          user: MinJun916
          filename: metrics.languages.raw.svg
          output_action: none
          base: ""
          config_timezone: Asia/Seoul
          config_display: regular
          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: MinJun916, ed125248@gmail.com
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 15
          debug: "yes"
      - name: Render language card without clipping
        run: python3 scripts/render-language-metrics.py /metrics_renders/metrics.languages.raw.svg metrics.languages.svg
      - name: Publish language card
        run: |
          git add metrics.languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update metrics.languages.svg - [Skip GitHub Action]'
          git pull --rebase origin main
          git push origin HEAD:main
