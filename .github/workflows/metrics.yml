name: GitHub language metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: github-language-metrics
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify company repository access with Metrics token
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: gh api repos/team-beatbuddy/backend --jq '{full_name, private, default_branch}'
      - name: Generate indepth language statistics
        # This source revision authenticates private repository clones.
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: "no"
          user: MinJun916
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Seoul
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: MinJun916, ed125248@gmail.com
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_indepth_custom: team-beatbuddy/backend
          # Analyze this repository once through the explicit entry above.
          plugin_languages_skipped: team-beatbuddy/backend
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 15
          debug: "yes"
